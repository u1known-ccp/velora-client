plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

evaluationDependsOn(':core')

base {
    archivesName = "velora-client-mc${project.minecraft_version}"
}

loom {
    // Loom 1.19 remaps mixins with tiny-remapper (no annotation processor / refmap needed)
    runs {
        client {
            client()
            configName = 'Velora Client'
            ideConfigGenerated true
            runDir 'run'
            vmArgs '-Xmx3G'
        }
        // Automated smoke test: audits mixins, opens all screens, joins a test world, writes screenshots
        selftest {
            client()
            configName = 'Velora Selftest'
            ideConfigGenerated false
            runDir 'run'
            vmArgs '-Xmx3G', '-Dvelora.selftest=true'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Core is plain Java; Gson & SLF4J are already shipped by Minecraft.
    implementation(project(':core')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
               'minecraft_version': project.minecraft_version,
               'loader_version': project.loader_version
    }
}

// Ship the core classes inside the mod jar (core has no Minecraft references, so remapping is a no-op).
jar {
    from(project(':core').sourceSets.main.output)
    from(rootProject.file('LICENSE')) { rename { "LICENSE_velora" } }
}
