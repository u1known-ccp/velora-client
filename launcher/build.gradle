plugins {
    id 'application'
    id 'org.openjfx.javafxplugin'
    id 'com.gradleup.shadow'
}

// All bundled game versions (newest first). Each client module provides its own minecraft/loader/fabric versions.
def clientModules = ['client-26.3', 'client-1.21.4']
clientModules.each { evaluationDependsOn(":$it") }

javafx {
    version = '21.0.5'
    modules = ['javafx.controls', 'javafx.graphics']
}
dependencies {
    implementation project(':core')
    // Windows DPAPI (Crypt32) for encrypting stored refresh tokens
    implementation 'net.java.dev.jna:jna-platform:5.15.0'
    implementation "org.slf4j:slf4j-simple:${project.slf4j_version}"

    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

application {
    // Plain main class (not extending Application) so the shaded jar also starts from the classpath
    mainClass = 'dev.velora.launcher.LauncherMain'
    applicationName = 'VeloraLauncher'
}

// Bundle every client module's production jar so the launcher can install the matching one per game profile.
// Stored as .bin: the Shadow plugin would otherwise unpack any nested *.jar into the fat jar.
def versionsFile = layout.buildDirectory.file('generated/velora/versions.properties')
def versionRows = clientModules.collect { name ->
    def p = project(":$name")
    [p.minecraft_version, p.loader_version, p.fabric_version]
}
def generateVersions = tasks.register('generateVersionsProperties') {
    inputs.property 'versions', versionRows.toString()
    outputs.file versionsFile
    doLast {
        def f = versionsFile.get().asFile
        f.parentFile.mkdirs()
        def text = new StringBuilder("versions=" + versionRows.collect { it[0] }.join(',') + "\n")
        versionRows.each { row -> text.append("${row[0]}.loader=${row[1]}\n${row[0]}.fabric_api=${row[2]}\n") }
        f.text = text.toString()
    }
}

processResources {
    clientModules.each { name ->
        def p = project(":$name")
        def jarTask = p.tasks.findByName('remapJar') ?: p.tasks.getByName('jar')
        dependsOn jarTask
        from(jarTask.archiveFile) {
            into 'velora/bundled'
            rename { "velora-client-${p.minecraft_version}.bin" }
        }
    }
    from(generateVersions) { into 'velora' }
    inputs.property 'version', project.version
    filesMatching('velora/launcher.properties') {
        expand 'version': project.version
    }
}


shadowJar {
    archiveBaseName = 'VeloraLauncher'
    archiveClassifier = ''
    mergeServiceFiles()
}
